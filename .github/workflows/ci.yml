name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Ubuntu on purpose: development is on Windows, so this also catches
    # path-separator and encoding sloppiness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Unit tests (golden/evals tiers excluded by config)
        run: uv run pytest -m "unit"
