# Personal profile for Rambler. Copy to user_profile.yaml (git-ignored) and edit.
# Nothing in the code assumes these values (plan.md principle 4).

home_stations:
  - { name: Herne Hill, crs: HNH }
  - { name: Tulse Hill, crs: TUH }
  - { name: Brixton, crs: BRX }

transport_notes:
  - Prefer Thameslink (Blackfriars / London Bridge) and Southeastern from Herne Hill.
  - Southeastern via a change at Bromley South is a good direct-ish route out.
  - Southern via Tulse Hill is fine.
  - South Western from Vauxhall (tube from Brixton) is a last resort.
  - Victoria and Blackfriars/London Bridge termini are easy; King's Cross and
    Liverpool Street cost an extra 30-40 minutes across town.

walk:
  max_distance_km: 13
  max_travel_minutes: 90
  min_distance_km: 5

lunch:
  preferred: [pub, cafe]
  position_along_route: [0.55, 0.80]
  notes:
    - Garden and kid-friendly menu are a bonus.
    - Picnic plus a drink stop is a fine alternative.

kids_ages: [4, 7]
